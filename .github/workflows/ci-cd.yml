name: Cypress Tests CI/CD

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      suite:
        description: "¿Qué suite ejecutar?"
        required: true
        default: "all"
        type: choice
        options:
          - login
          - objetivos
          - all

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v3

      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Instalar dependencias
        run: npm install

      - name: 🔑 Configurar variables de entorno
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> $GITHUB_ENV
          echo "NORMAL_USER=${{ secrets.NORMAL_USER }}" >> $GITHUB_ENV
          echo "NORMAL_PASS=${{ secrets.NORMAL_PASS }}" >> $GITHUB_ENV
          echo "SPECIAL_USER=${{ secrets.SPECIAL_USER }}" >> $GITHUB_ENV
          echo "SPECIALUSER_PASS=${{ secrets.SPECIALUSER_PASS }}" >> $GITHUB_ENV

      # --- Branch conditions ---
      - name: 🚀 Ejecutar solo pruebas de login en Cypress (rama test/001/login)
        if: github.ref == 'refs/heads/test/001/login'
        run: npx cypress run --spec "cypress/e2e/Login/**/*"

      - name: 🚀 Ejecutar solo pruebas de objetivos en Cypress (rama test/002/objetivos)
        if: github.ref == 'refs/heads/test/002/objetivos'
        run: npx cypress run --spec "cypress/e2e/Cards/**/*"

      # --- Manual inputs ---
      - name: 🚀 Ejecutar pruebas seleccionadas (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.suite }}" == "login" ]; then
            npx cypress run --spec "cypress/e2e/Login/**/*"
          elif [ "${{ github.event.inputs.suite }}" == "objetivos" ]; then
            npx cypress run --spec "cypress/e2e/Cards/**/*"
          else
            npx cypress run
          fi

      - name: 📊 Guardar reportes de pruebas
        uses: actions/upload-artifact@v4
        with:
          name: Cypress Reports
          path: cypress/reports
